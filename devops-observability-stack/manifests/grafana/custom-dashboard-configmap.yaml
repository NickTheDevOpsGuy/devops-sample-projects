apiVersion: v1
kind: ConfigMap
metadata:
  name: node-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  node-metrics-dashboard.json: |
    {
      "title": "Node Metrics",
      "panels": [
        {
          "type": "graph",
          "title": "CPU Usage",
          "targets": [
            {
              "expr": "instance:node_cpu_utilisation:rate1m",
              "legendFormat": "{{instance}}"
            }
          ]
        }
      ]
    }