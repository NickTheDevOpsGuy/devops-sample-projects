name: CI Pipeline

# 🔐 REQUIRED SECRETS (Set these in GitHub repo → Settings → Secrets → Actions):
# - CR_USERNAME: your GitHub username (e.g., NickTheDevOpsGuy)
# - CR_PAT: GitHub Personal Access Token with 'write:packages' & 'read:packages'

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'ci-cd-github-actions/**'
    branches: [ "develop" ]
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'ci-cd-github-actions/**'
    branches: [ "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ci-cd-github-actions

    steps:
    - name: ⬇️ Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 📦 Install dependencies
      run: npm install

    - name: 🧪 Run Jest tests
      run: npm test

    - name: 📊 Generate coverage report
      run: npm run coverage

    - name: 💾 Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/

    - name: 🐳 Log in to GitHub Container Registry
      run: echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u "${{ secrets.CR_USERNAME }}" --password-stdin

    - name: 🏗️ Build Docker image
      run: |
        IMAGE_ID=ghcr.io/${{ secrets.CR_USERNAME }}/node-ci-app
        IMAGE_TAG=latest
        docker build -t $IMAGE_ID:$IMAGE_TAG .

    - name: 🚀 Push Docker image
      run: |
        IMAGE_ID=ghcr.io/${{ secrets.CR_USERNAME }}/node-ci-app
        IMAGE_TAG=latest
        docker push $IMAGE_ID:$IMAGE_TAG
