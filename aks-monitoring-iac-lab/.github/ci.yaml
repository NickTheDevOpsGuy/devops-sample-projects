name: CI

on:
  push:
    paths:
      - 'infrastructure/bicep/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'infrastructure/bicep/**'
      - 'tests/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Azure CLI & Bicep
        uses: azure/setup-cli@v3

      - name: Bicep build
        run: az bicep build --file infrastructure/bicep/main.bicep

      - name: Run connectivity test
        run: bash tests/connectivity.sh
