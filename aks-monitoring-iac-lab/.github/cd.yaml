name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Infra (prod)
        run: bash scripts/deploy-infra.sh YourResourceGroupName prod

      - name: Deploy App
        run: bash scripts/deploy-app.sh
