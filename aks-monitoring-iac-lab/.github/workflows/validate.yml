name: Validate Bicep

on:
  push:
    paths:
      - '**/*.bicep'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep CLI
        run: az bicep install
      - name: Validate Bicep files
        run: az bicep build --file infrastructure/bicep/main.bicep