name: CI Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Run ESLint
      run: npx eslint .

    - name: Run tests
      run: npm test
  
    - name: Log in to GHCR
      run: echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u "${{ secrets.CR_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: docker build -t ghcr.io/${{ secrets.CR_USERNAME }}/node-ci-app:latest .

    - name: Push Docker image to GHCR
      run: docker push ghcr.io/${{ secrets.CR_USERNAME }}/node-ci-app:latest