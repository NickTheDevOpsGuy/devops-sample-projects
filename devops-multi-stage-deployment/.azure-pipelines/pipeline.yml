trigger:
  branches:
    include:
      - main

variables:
  dockerRegistryServiceConnection: 'YourDockerRegistryServiceConnection'
  imageRepository: 'fastapi-devops-app'
  containerRegistry: 'youracr.azurecr.io'
  dockerfilePath: 'Dockerfile'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: '🔧 Build and Push Docker Image'
  jobs:
    - job: Build
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - task: Docker@2
          displayName: '📦 Build and Push Docker image'
          inputs:
            containerRegistry: $(dockerRegistryServiceConnection)
            repository: $(imageRepository)
            command: 'buildAndPush'
            Dockerfile: $(dockerfilePath)
            tags: |
              $(tag)

- stage: Dev
  displayName: '🚀 Deploy to Dev'
  dependsOn: Build
  jobs:
    - deployment: DevDeploy
      environment: 'dev'
      strategy:
        runOnce:
          deploy:
            steps:
              - script: |
                  echo "Deploying to Dev..."
                  az webapp config container set \
                    --name devops-demo-app-dev \
                    --resource-group NickClarkRG \
                    --docker-custom-image-name $(containerRegistry)/$(imageRepository):$(tag) \
                    --docker-registry-server-url https://$(containerRegistry)
                displayName: '🌍 Deploy to Azure Web App - Dev'

- stage: Staging
  displayName: '🧪 Deploy to Staging'
  dependsOn: Dev
  condition: succeeded()
  jobs:
    - deployment: StagingDeploy
      environment: 'staging'
      strategy:
        runOnce:
          deploy:
            steps:
              - script: |
                  echo "Deploying to Staging..."
                  az webapp config container set \
                    --name devops-demo-app-staging \
                    --resource-group NickClarkRG \
                    --docker-custom-image-name $(containerRegistry)/$(imageRepository):$(tag) \
                    --docker-registry-server-url https://$(containerRegistry)
                displayName: '🛰️ Deploy to Azure Web App - Staging'

- stage: Production
  displayName: '🏁 Deploy to Production'
  dependsOn: Staging
  condition: succeeded()
  jobs:
    - deployment: ProdDeploy
      environment: 'production'
      strategy:
        runOnce:
          deploy:
            steps:
              - script: |
                  echo "Deploying to Production..."
                  az webapp config container set \
                    --name devops-demo-app-prod \
                    --resource-group NickClarkRG \
                    --docker-custom-image-name $(containerRegistry)/$(imageRepository):$(tag) \
                    --docker-registry-server-url https://$(containerRegistry)
                displayName: '🚢 Deploy to Azure Web App - Prod'