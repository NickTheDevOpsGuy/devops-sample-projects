trigger:
  branches:
    include:
      - main

variables:
  - group: devops-app-settings  # 👈 Linked Variable Group w/ secrets + env values

stages:

- stage: Build
  displayName: '🔧 Build and Push Docker Image'
  jobs:
    - job: BuildAndPush
      displayName: '📦 Build Docker Image and Push to ACR'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - task: Docker@2
          inputs:
            containerRegistry: $(dockerRegistryServiceConnection)
            repository: $(imageRepository)
            command: buildAndPush
            Dockerfile: $(dockerfilePath)
            tags: |
              $(Build.BuildId)

- stage: Dev
  displayName: '🚀 Deploy to Dev Environment'
  dependsOn: Build
  jobs:
    - deployment: DevDeploy
      displayName: '🌍 Deploy to Azure Web App - Dev'
      environment: 'dev'
      strategy:
        runOnce:
          deploy:
            steps:
              - script: |
                  echo "Deploying to Dev..."
                  az webapp config container set \
                    --name $(devAppName) \
                    --resource-group $(resourceGroup) \
                    --docker-custom-image-name $(containerRegistry)/$(imageRepository):$(Build.BuildId) \
                    --docker-registry-server-url https://$(containerRegistry)
                displayName: 'Deploy Dev Container'

- stage: Staging
  displayName: '🧪 Deploy to Staging (Requires Approval)'
  dependsOn: Dev
  condition: succeeded()
  jobs:
    - deployment: StagingDeploy
      displayName: '🛰️ Deploy to Azure Web App - Staging'
      environment: 'staging'
      strategy:
        runOnce:
          deploy:
            steps:
              - script: |
                  echo "Deploying to Staging..."
                  az webapp config container set \
                    --name $(stagingAppName) \
                    --resource-group $(resourceGroup) \
                    --docker-custom-image-name $(containerRegistry)/$(imageRepository):$(Build.BuildId) \
                    --docker-registry-server-url https://$(containerRegistry)
                displayName: 'Deploy Staging Container'

- stage: Production
  displayName: '🏁 Deploy to Production (Requires Approval)'
  dependsOn: Staging
  condition: succeeded()
  jobs:
    - deployment: ProdDeploy
      displayName: '🚢 Deploy to Azure Web App - Prod'
      environment: 'production'
      strategy:
        runOnce:
          deploy:
            steps:
              - script: |
                  echo "Deploying to Production..."
                  az webapp config container set \
                    --name $(prodAppName) \
                    --resource-group $(resourceGroup) \
                    --docker-custom-image-name $(containerRegistry)/$(imageRepository):$(Build.BuildId) \
                    --docker-registry-server-url https://$(containerRegistry)
                displayName: 'Deploy Prod Container'